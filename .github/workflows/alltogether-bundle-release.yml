name: AllTogether SKSE bundle release

on:
  workflow_dispatch:
    inputs:
      launcher-run-id:
        description: Reuse artifacts from a successful launcher build run; leave blank to rebuild
        required: false
        type: string
        default: ''
  push:
    branches:
      - 'release/alltogether-skse-bundle'

permissions:
  contents: write
  actions: read

concurrency:
  group: alltogether-skse-bundle
  cancel-in-progress: false

jobs:
  launcher:
    if: ${{ inputs.launcher-run-id == '' }}
    name: STR 1.8.7 / Skyrim ${{ matrix.game-version }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        game-version: ['1.7.104', '1.6.1170']
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout STR 1.8.7 source
        uses: actions/checkout@v7
        with:
          repository: absol89/TiltedEvolutionScriptFixes
          ref: cee0754eec54b52c6198f7ba59b93e0f413e5b75
          path: str
          fetch-depth: 0

      - name: Checkout add-ons
        uses: actions/checkout@v7
        with:
          path: bundle

      - name: Checkout pinned latest add-on commits
        shell: bash
        run: |
          set -euo pipefail
          i=0
          while read -r branch commit script label; do
            [[ -z "$branch" || "$branch" == \#* ]] && continue
            i=$((i + 1))
            git clone --no-checkout "https://github.com/mailamea10/TiltedEvolution-dwmapi.dll.git" "addon-$i"
            git -C "addon-$i" fetch --depth 1 origin "$commit"
            git -C "addon-$i" checkout --detach FETCH_HEAD
            test "$(git -C "addon-$i" rev-parse HEAD)" = "$commit"
            echo "$branch $commit $label $script" >> bundle/Tools/AllTogether/addons.resolved.txt
          done < bundle/Tools/AllTogether/addons.lock
          test "$i" -eq 4

      - name: Pin STR version and submodules
        working-directory: str
        run: |
          git checkout --force cee0754eec54b52c6198f7ba59b93e0f413e5b75
          git tag -f v1.8.7 HEAD
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Apply pinned privacy and runtime patches
        shell: pwsh
        run: python bundle/Tools/AllTogether/prepare_source.py str --skyrim-version '${{ matrix.game-version }}'

      - name: Apply all four current add-ons
        shell: bash
        run: |
          set -euo pipefail
          i=0
          while read -r branch commit script label; do
            [[ -z "$branch" || "$branch" == \#* ]] && continue
            i=$((i + 1))
            python "addon-$i/$script" str --protocol 1.8.5
          done < bundle/Tools/AllTogether/addons.lock

      - name: Apply bundle RaceMenu reconnect fix
        run: python bundle/Tools/AllTogether/apply_addon_fixes.py str

      - name: Restore xmake packages
        id: pkgcache
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/.xmake/packages
          key: windows-2022-xmake-pkgs-${{ hashFiles('str/**/xmake.lua') }}-${{ matrix.game-version }}
          restore-keys: |
            windows-2022-xmake-pkgs-${{ hashFiles('str/**/xmake.lua') }}-
            windows-2022-xmake-pkgs-

      - name: Configure xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.0
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: windows-2022

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Save xmake packages
        if: always() && steps.pkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/AppData/Local/.xmake/packages
          key: windows-2022-xmake-pkgs-${{ hashFiles('str/**/xmake.lua') }}-${{ matrix.game-version }}

      - name: Build launcher
        working-directory: str
        run: |
          if [[ '${{ matrix.game-version }}' == '1.6.1170' ]]; then
            xmake config --plat=windows --arch=x64 --mode=releasedbg --skyrim_version=1.6.1170 --yes -vD
          else
            xmake config --plat=windows --arch=x64 --mode=releasedbg --yes -vD
          fi
          xmake build -y -vD SkyrimImmersiveLauncher

      - name: Collect launcher
        shell: pwsh
        run: |
          $dir = "bundle-output/STR-1.8.7-Skyrim-${{ matrix.game-version }}"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "str/build/windows/x64/releasedbg/SkyrimTogether.exe" "$dir/"
          Copy-Item "str/build/windows/x64/releasedbg/EarlyLoad.dll" "$dir/" -ErrorAction SilentlyContinue
          Copy-Item "bundle/Tools/AllTogether/INSTALLATION.txt" "$dir/"
          Copy-Item "bundle/Tools/AllTogether/addons.resolved.txt" "$dir/"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem -Recurse "$vs\VC\Tools\MSVC" -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $exports = (& $dumpbin.FullName /exports "$dir/SkyrimTogether.exe") -join "`n"
          foreach ($name in @('STRModSync_HostApiVersion','STRRaceMenu_HostApiVersion','STRLipSync_HostApiVersion','STRRagdoll_HostApiVersion')) {
            if (-not ($exports -match [regex]::Escape($name))) { throw "Missing required add-on export: $name" }
          }

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v7
        with:
          name: launcher-1.8.7-${{ matrix.game-version }}
          path: bundle-output
          if-no-files-found: error
          retention-days: 14

  release:
    needs: launcher
    if: ${{ always() && (needs.launcher.result == 'success' || inputs.launcher-run-id != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: bundle-output
          run-id: ${{ inputs.launcher-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download latest released add-on packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p bundle-output/addons/ragdoll bundle-output/addons/lipsync bundle-output/addons/racemenu bundle-output/addons/skyparkour
          gh release download ragdoll-together-v1.0.0 -R mailamea10/TiltedEvolution-dwmapi.dll -D bundle-output/addons/ragdoll --pattern 'Ragdoll_Together_Physics_Sync-1.0.0-*.zip'
          gh release download lipsync-together-v0.2.0 -R mailamea10/TiltedEvolution-dwmapi.dll -D bundle-output/addons/lipsync --pattern 'LipSync_Together_Voice_Lip_Sync-0.8.0-*.zip'
          gh release download racemenu-together-v1.0.0 -R mailamea10/TiltedEvolution-dwmapi.dll -D bundle-output/addons/racemenu --pattern 'RaceMenu_Together_Appearance_Sync-1.0.0-*.zip'
          gh release download skyparkour-together-v1.0.0 -R mailamea10/TiltedEvolution-dwmapi.dll -D bundle-output/addons/skyparkour --pattern 'SkyParkour_Together_Parkour_Animations_Sync-1.0.1-*.zip'
          test "$(find bundle-output/addons -type f -name '*.zip' | wc -l)" -eq 4
      - name: Assemble and publish bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python Tools/AllTogether/assemble_fomod.py "$PWD" bundle-output/fomod-package
          cp Tools/AllTogether/SOURCES.txt bundle-output/fomod-package/Docs/
          (cd bundle-output/fomod-package && zip -qr "$GITHUB_WORKSPACE/AllTogether-SKSE-Bundle-1.zip" .)
          tag=alltogether-skse-bundle-1
          title='AllTogether SKSE (Skyrim Together Add-ons Bundle 1)'
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" AllTogether-SKSE-Bundle-1.zip --clobber
            gh release edit "$tag" --title "$title" --notes-file Tools/AllTogether/RELEASE_NOTES.md
          else
            gh release create "$tag" AllTogether-SKSE-Bundle-1.zip \
              --title "$title" \
              --notes-file Tools/AllTogether/RELEASE_NOTES.md
          fi
