name: RaceMenu Together release

# Builds the RaceMenu Together FOMOD:
# - the SKSE plugin (one DLL for every runtime; it touches no game memory),
# - the shared Skyrim Together launcher (release/together-launcher), which carries the add-ons of every mod in
#   this repository, from the together-launcher pre-release: one per Skyrim Together release and game version,
#   so this mod's SkyrimTogether.exe is the same file every other mod of ours ships,
# and adds the archive to the GitHub release, next to any archives already there.
#
# The Together Launcher workflow starts this one after every launcher build.

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/racemenu-together**'

env:
  MOD_VERSION: '1.0.0'

jobs:
  plugin:
    name: SKSE plugin
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build RaceMenuTogether.dll
        shell: cmd
        run: call Mods\RaceMenuTogether\Plugin\build.bat

      - name: Check the exports
        shell: cmd
        run: dumpbin /exports Mods\RaceMenuTogether\Plugin\build\RaceMenuTogether.dll | findstr /C:"SKSEPlugin_" /C:"STRRaceMenu_"

      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          retention-days: 14
          if-no-files-found: error
          path: Mods/RaceMenuTogether/Plugin/build/RaceMenuTogether.dll

  package:
    name: FOMOD
    needs: [plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Assemble the FOMOD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          root=Mods/RaceMenuTogether
          pkg="pkg"
          mkdir -p "$pkg/fomod/images" "$pkg/00 Core/SKSE/Plugins" "$pkg/00 Core/Docs"
          cp "$root/fomod/info.xml" "$root/fomod/ModuleConfig.xml" "$pkg/fomod/"
          cp "$root/fomod/images/banner.png" "$pkg/fomod/images/"
          cp artifacts/plugin/RaceMenuTogether.dll "$pkg/00 Core/SKSE/Plugins/"
          cp "$root/README.txt" "$pkg/00 Core/Docs/RaceMenu Together - README.txt"
          cp LICENSE "$pkg/00 Core/Docs/RaceMenu Together - LICENSE.txt"
          # The shared launcher, one archive per Skyrim Together release and game version.
          gh release download together-launcher -p 'TogetherLauncher-*.zip' -p 'LAUNCHER_MANIFEST.txt' -D launcher
          for archive in launcher/TogetherLauncher-*.zip; do
            unzip -q -o "$archive" -d "$pkg"
          done
          cp launcher/LAUNCHER_MANIFEST.txt "$pkg/00 Core/Docs/RaceMenu Together - launcher manifest.txt"
          find "$pkg" -type f | sort
          name="RaceMenu_Together_Appearance_Sync-${MOD_VERSION}-STR-1.8.3-and-1.8.5.zip"
          (cd "$pkg" && zip -r -q "../$name" .)
          ls -la "$name"
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"

      - name: Upload the FOMOD
        uses: actions/upload-artifact@v7
        with:
          name: RaceMenuTogether-${{ env.MOD_VERSION }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ env.ARCHIVE }}

      - name: Add the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="racemenu-together-v${MOD_VERSION}"
          # Archives already on the release stay as they are; this one is added (or replaced on a rebuild).
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
              --title "RaceMenu Together (RaceMenu Appearance Sync) ${MOD_VERSION}" \
              --notes-file Mods/RaceMenuTogether/RELEASE_NOTES.md
          fi
          gh release upload "$tag" "$ARCHIVE" --clobber
          gh release edit "$tag" --notes-file Mods/RaceMenuTogether/RELEASE_NOTES.md
