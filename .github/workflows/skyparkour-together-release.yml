name: SkyParkour Together release

# Builds the SkyParkour Together FOMOD:
# - the SKSE plugin (one DLL for every runtime; it touches no game memory),
# - the Skyrim Together launcher with the STR Mod Sync add-on, once per game version, each from that
#   version's Skyrim Together Reborn 1.8.5 source with nothing else changed,
# and publishes the archive as a GitHub release.

on:
  workflow_dispatch:
    inputs:
      server_version:
        description: 'Version string the STR server compares against'
        required: false
        default: 'v1.8.5'
  push:
    branches:
      - 'release/skyparkour-**'

env:
  MOD_VERSION: '1.0.0'
  SERVER_VERSION: ${{ github.event.inputs.server_version || 'v1.8.5' }}

jobs:
  str-addon:
    name: STR add-on (${{ matrix.game }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # Skyrim Together Reborn 1.8.5 for 1.7.104
          - game: '1.7.104'
            base: 0f1876e692310959b5c67ae148357e9d4c7ed9ff
            folder: '10 STR Add-on 1.7.104'
            legacy: false
          # Skyrim Together Reborn 1.8.5 for 1.6.1170 / 1.6.1179
          - game: '1.6.1170'
            base: 043dad02c086c158a4b1e24d136e2c97c8a6d15f
            folder: '11 STR Add-on 1.6.1170'
            legacy: false
          # Skyrim Together Reborn 1.8.5 for 1.5.97 (before any of this fork's feature work)
          - game: '1.5.97'
            base: e6a097e1915a58d53343b167c24367f92303bcc0
            folder: '12 STR Add-on 1.5.97'
            legacy: true
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          path: release

      - name: Checkout Skyrim Together source for ${{ matrix.game }}
        uses: actions/checkout@v7
        with:
          path: str
          fetch-depth: 0

      - name: Select base commit and pin protocol version
        working-directory: str
        run: |
          git checkout --force "${{ matrix.base }}"
          git log -1 --format='base: %H %s'
          git tag -f "$SERVER_VERSION" HEAD
          echo "client will report version: $(git describe --tags --abbrev=0)"
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Apply the STR Mod Sync add-on
        run: python release/Mods/SkyParkourTogether/StrAddon/apply_addon.py str

      - name: Restore xmake packages
        id: pkgcache
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-pkgs-${{ hashFiles('str/**/xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-xmake-pkgs-

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.0
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: windows-2022

      - name: Configure xmake and install dependencies
        working-directory: str
        run: xmake config --plat=windows --arch=x64 --mode=releasedbg --yes -vD

      - name: Save xmake packages
        if: always() && steps.pkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-pkgs-${{ hashFiles('str/**/xmake.lua') }}-${{ matrix.game }}

      - name: Build the launcher
        working-directory: str
        run: |
          set +e
          if [ "${{ matrix.legacy }}" = "true" ]; then
            targets="ImmersiveElf TPProcess SkyrimImmersiveLauncherLegacyNoConsole"
          else
            targets="SkyrimImmersiveLauncher"
          fi
          status=0
          for target in $targets; do
            xmake build -y -vD "$target" 2>&1 | tee -a build.log
            [ ${PIPESTATUS[0]} -ne 0 ] && status=1 && break
          done
          grep -E "error C[0-9]+|error LNK[0-9]+|fatal error|: error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          exit $status

      - name: Collect the add-on files
        run: |
          out=str/build/windows/x64/releasedbg
          dest="addon/${{ matrix.folder }}/SkyrimTogetherRuntime"
          mkdir -p "$dest"
          if [ "${{ matrix.legacy }}" = "true" ]; then
            cp "$out/legacy-noconsole/SkyrimTogether.exe" "$out/EarlyLoad.dll" "$out/TPProcess.exe" "$dest/"
            cp str/GameFiles/Skyrim/SKSE/Plugins/versionlib-ae-to-se-1-5-97-0.map "$dest/"
          else
            cp "$out/SkyrimTogether.exe" "$dest/"
          fi
          find addon -type f | sort

      - name: Upload the add-on
        uses: actions/upload-artifact@v7
        with:
          name: addon-${{ matrix.game }}
          retention-days: 14
          if-no-files-found: error
          path: addon

  plugin:
    name: SKSE plugin
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build SkyParkourTogether.dll
        shell: cmd
        run: call Mods\SkyParkourTogether\Plugin\build.bat

      - name: Check the exports
        shell: cmd
        run: dumpbin /exports Mods\SkyParkourTogether\Plugin\build\SkyParkourTogether.dll | findstr /C:"SKSEPlugin_" /C:"STRModSync_"

      - name: Upload the plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          retention-days: 14
          if-no-files-found: error
          path: Mods/SkyParkourTogether/Plugin/build/SkyParkourTogether.dll

  package:
    name: FOMOD
    needs: [str-addon, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Assemble the FOMOD
        run: |
          set -e
          root=Mods/SkyParkourTogether
          pkg="pkg"
          mkdir -p "$pkg/fomod/images" "$pkg/00 Core/SKSE/Plugins" "$pkg/00 Core/Docs"
          cp "$root/fomod/info.xml" "$root/fomod/ModuleConfig.xml" "$pkg/fomod/"
          cp "$root/fomod/images/banner.png" "$pkg/fomod/images/"
          cp artifacts/plugin/SkyParkourTogether.dll "$pkg/00 Core/SKSE/Plugins/"
          cp "$root/README.txt" "$pkg/00 Core/Docs/SkyParkour Together - README.txt"
          cp LICENSE "$pkg/00 Core/Docs/SkyParkour Together - LICENSE.txt"
          for game in 1.7.104 1.6.1170 1.5.97; do
            cp -r artifacts/addon-$game/* "$pkg/"
          done
          find "$pkg" -type f | sort
          name="SkyParkour_Together_Parkour_Animations_Sync-${MOD_VERSION}.zip"
          (cd "$pkg" && zip -r -q "../$name" .)
          ls -la "$name"
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"

      - name: Upload the FOMOD
        uses: actions/upload-artifact@v7
        with:
          name: SkyParkourTogether-${{ env.MOD_VERSION }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ env.ARCHIVE }}

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="skyparkour-together-v${MOD_VERSION}"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" "$ARCHIVE" --prerelease --target "$GITHUB_SHA" \
            --title "SkyParkour Together (Parkour Animations Sync) ${MOD_VERSION}" \
            --notes-file Mods/SkyParkourTogether/RELEASE_NOTES.md
