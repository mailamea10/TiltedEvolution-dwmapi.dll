name: Merged RaceMenu + Parkour build

# Compiles the 1.5.x runtime (SKYRIM_TARGET_LEGACY) and the SKSE bootstrap plugin.
# This is a compile check plus the two DLLs as a downloadable artifact; the release
# package is assembled in a later step once this builds.

on:
  workflow_dispatch:
    inputs:
      server_version:
        description: 'Version string the server compares against (the STR server release this build must talk to)'
        required: false
        default: 'v1.8.5'
  push:
    branches:
      - 'feature/legacy-1.5.97-on-1.8.5-racemenu-parkour'
      - 'fix/racemenu-per-character-sync'
    tags:
      - 'racemenu-parkour-combined-fomod-test'

jobs:
  build-legacy:
    runs-on: windows-2022
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          # full history is needed to create the version string (BuildInfo.h)
          fetch-depth: 0

      # This branch must not replace the existing rolling legacy-test release.
      # Cancel overlapping runs from this branch before doing the combined build.
      - name: Protect existing release and avoid duplicate builds
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace(/^refs\/heads\//, "");
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, per_page: 100 });
            const protectedWorkflows = new Set(["Legacy 1.5.97 build", "Merged RaceMenu + Parkour build"]);
            const targets = new Map();
            for (const run of data.workflow_runs) {
              if (run.id === context.runId || run.head_branch !== branch || run.status === "completed" || !protectedWorkflows.has(run.name)) continue;
              targets.set(run.id, run.name);
            }
            // Earlier runs were started before this guard was added. Cancel those exact runs too.
            for (const id of [38898351019, 38898735145, 38898922783, 38898351090, 38898922864]) {
              if (id !== context.runId) targets.set(id, "previous run");
            }
            for (const [id, name] of targets) {
              core.info(`Cancelling overlapping run ${id} (${name}) to protect the existing release.`);
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: id });
              } catch (error) {
                core.warning(`Could not cancel run ${id}: ${error.message}`);
              }
            }

      # The client reports xmake's GIT_TAG as its version and the server refuses
      # any client whose string differs from its own ("expects version v1.8.5 but
      # you are on version none"). This fork carries no release tags, so tag the
      # build with the server version it is meant to talk to.
      - name: Pin protocol version
        env:
          SERVER_VERSION: ${{ github.event.inputs.server_version || 'v1.8.5' }}
        run: |
          # On a tag-triggered full release, remove that tag locally so git describe
          # cannot report the release tag instead of the server protocol version.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then git tag -d "$GITHUB_REF_NAME" || true; fi
          git tag -f "$SERVER_VERSION" HEAD
          echo "client will report version: $(git describe --tags --abbrev=0)"

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      # restore + save are split so the dependency cache is also saved when a later
      # step fails (the plain cache action only saves after a fully green job)
      - name: Restore xmake packages
        id: pkgcache
        uses: actions/cache/restore@v6
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-pkgs-${{ hashFiles('**/xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-xmake-pkgs-

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.0
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: windows-2022

      - name: Configure xmake and install dependencies
        run: xmake config --plat=windows --arch=x64 --mode=releasedbg --yes -vD

      - name: Save xmake packages
        if: always() && steps.pkgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-pkgs-${{ hashFiles('**/xmake.lua') }}

      - name: Build legacy runtime DLL
        run: |
          set +e
          xmake build -y -vD SkyrimTogetherClientDllLegacy 2>&1 | tee build-legacy.log
          status=${PIPESTATUS[0]}
          # surface compiler/linker errors as annotations so they can be read
          # without downloading the full job log
          grep -E "error C[0-9]+|error LNK[0-9]+|fatal error|: error:" build-legacy.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          exit $status

      - name: Show reported version
        if: always()
        run: |
          echo "::notice::$(grep -h BUILD_COMMIT build/BuildInfo.h 2>/dev/null | head -1)"
          echo "::notice::$(find build -name BuildInfo.h -exec grep -H BUILD_COMMIT {} \; | head -3 | tr '\n' ' ')"

      - name: Build SKSE bootstrap plugin
        run: |
          xmake build -y -vD SkyrimTogetherSKSE
          xmake build -y -vD TPProcess

      # The immersive launcher (SkyrimTogether.exe), built against the 1.5.x client.
      # It lands in releasedbg/legacy so it does not clash with the 1.6 launcher.
      - name: Build legacy immersive launcher
        run: |
          set +e
          xmake build -y -vD SkyrimImmersiveLauncherLegacy 2>&1 | tee build-launcher.log
          status=${PIPESTATUS[0]}
          if [ $status -eq 0 ]; then
            xmake build -y -vD SkyrimImmersiveLauncherLegacyNoConsole 2>&1 | tee -a build-launcher.log
            status=${PIPESTATUS[0]}
          fi
          grep -E "error C[0-9]+|error LNK[0-9]+|fatal error|: error:" build-launcher.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          exit $status

      # RaceMenu sync adds a message type the server has to relay, so this branch ships its server too.
      - name: Build server
        run: |
          set +e
          xmake build -y -vD SkyrimServerRunner 2>&1 | tee build-server.log
          status=${PIPESTATUS[0]}
          grep -E "error C[0-9]+|error LNK[0-9]+|fatal error|: error:" build-server.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          exit $status

      - name: List build outputs
        if: always()
        run: find build -maxdepth 6 \( -name 'SkyrimTogetherRuntime*' -o -name 'SkyrimTogetherSKSE*' -o -name 'SkyrimTogether.exe' -o -name 'EarlyLoad.dll' -o -name 'STServer.dll' -o -name 'SkyrimTogetherServer.exe' \) | sort

      - name: Package full FOMOD client and matching server
        run: |
          out=build/windows/x64/releasedbg
          rm -rf package
          mkdir -p package/client/"00 Core" package/client/"01 Standard Launcher"/SkyrimTogetherRuntime package/client/"02 Console Launcher"/SkyrimTogetherRuntime package/client/fomod package/server

          # GameFiles/Skyrim is the complete Data-folder payload tracked by this repo.
          cp -R GameFiles/Skyrim/. package/client/"00 Core"/
          mkdir -p package/client/"00 Core"/SKSE/Plugins package/client/"00 Core"/SkyrimTogetherRuntime
          cp "$out/SkyrimTogetherRuntime_1_5.dll" "$out/SkyrimTogetherSKSE.dll" package/client/"00 Core"/SKSE/Plugins/
          cp "$out/EarlyLoad.dll" "$out/TPProcess.exe" package/client/"00 Core"/SkyrimTogetherRuntime/
          cp "$out/legacy-noconsole/SkyrimTogether.exe" package/client/"01 Standard Launcher"/SkyrimTogetherRuntime/SkyrimTogether.exe
          cp "$out/legacy/SkyrimTogether.exe" package/client/"02 Console Launcher"/SkyrimTogetherRuntime/SkyrimTogether.exe
          cp Packaging/combined/fomod/ModuleConfig.xml Packaging/combined/fomod/info.xml package/client/fomod/
          cp Packaging/combined/README-client.txt package/client/README.txt
          cp LICENSE package/client/LICENSE.txt

          cp "$out/STServer.dll" "$out/SkyrimTogetherServer.exe" package/server/
          cp Packaging/combined/README-server.txt package/server/README.txt
          cp LICENSE package/server/LICENSE.txt

          (cd package/client && 7z a -tzip ../../TiltedEvolution-RaceMenu-Parkour-1.5.97-FOMOD.zip . > /dev/null)
          (cd package/server && 7z a -tzip ../../TiltedEvolution-RaceMenu-Parkour-Server-1.8.5.zip . > /dev/null)
          ls -lh TiltedEvolution-RaceMenu-Parkour-1.5.97-FOMOD.zip TiltedEvolution-RaceMenu-Parkour-Server-1.8.5.zip

      - name: Upload full FOMOD package artifact
        uses: actions/upload-artifact@v7
        with:
          name: TiltedEvolution-RaceMenu-Parkour-1.5.97-FOMOD
          retention-days: 30
          if-no-files-found: error
          path: |
            TiltedEvolution-RaceMenu-Parkour-1.5.97-FOMOD.zip
            TiltedEvolution-RaceMenu-Parkour-Server-1.8.5.zip

      - name: Publish merged RaceMenu + Parkour pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/legacy-1.5.97-on-1.8.5-racemenu-parkour'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=build/windows/x64/releasedbg
          mkdir -p publish
          cp "$out/SkyrimTogetherRuntime_1_5.dll" "$out/SkyrimTogetherSKSE.dll" "$out/TPProcess.exe" "$out/EarlyLoad.dll" "$out/legacy/SkyrimTogether.exe" publish/
          cp "$out/STServer.dll" "$out/SkyrimTogetherServer.exe" publish/
          cp GameFiles/Skyrim/SKSE/Plugins/versionlib-ae-to-se-1-5-97-0.map publish/
          ls -la publish
          gh release delete racemenu-parkour-combined-test --yes --cleanup-tag || true
          gh release create racemenu-parkour-combined-test publish/* --prerelease --target "$GITHUB_SHA" \
            --title "RaceMenu + Parkour combined test build (${GITHUB_SHA::8})" \
            --notes "Combined legacy 1.5.97 build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}: RaceMenu appearance sync and SkyParkour animation sync. Separate pre-release; the existing main build and feature test releases are unchanged."

      - name: Publish full FOMOD pre-release without replacing the existing test tag
        if: github.event_name == 'push' && github.ref == 'refs/tags/racemenu-parkour-combined-fomod-test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create racemenu-parkour-combined-fomod-test TiltedEvolution-RaceMenu-Parkour-1.5.97-FOMOD.zip TiltedEvolution-RaceMenu-Parkour-Server-1.8.5.zip --verify-tag --prerelease --title "RaceMenu + Parkour combined FOMOD test build (${GITHUB_SHA::8})" --notes "Complete mod-manager package for the combined Skyrim SE 1.5.97 RaceMenu appearance-sync and Parkour-sync build at ${GITHUB_SHA}. This is a separate pre-release and does not replace racemenu-parkour-combined-test or the main build."
