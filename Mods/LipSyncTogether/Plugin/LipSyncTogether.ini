; LipSync Together settings. Changes take effect the next time the game starts.

[Microphone]
; Part of the microphone's name, as listed in Documents\My Games\Skyrim Special Edition\SKSE\LipSyncTogether.log.
; Leave empty to use the Windows default communications microphone.
; Some virtual or software audio devices pass only silence; if so, name your real microphone here instead.
Device=

[Voice]
; 1: only a voice moves the mouth. Speech has a pitch; keyboard clicks, fans and other room noise do not, so they are
; ignored. 0: anything loud enough moves it.
NoiseFilter=1
; How clearly pitched a sound must be to count as a voice, 0 to 1. Lower it if quiet or breathy speech is missed,
; raise it if some noise still gets through.
VoiceThreshold=0.5
; How many dB above the background noise counts as speech. Raise it if the mouth moves on noise, lower it if
; quiet speech is missed.
GateDb=10
; Anything quieter than this (dBFS) never counts as speech.
MinLevelDb=-55
; How far the jaw opens (1 = normal). The jaw follows your own speaking volume, so this rarely needs changing.
Sensitivity=1.0
; How long the mouth keeps moving after the voice stops, in milliseconds (covers "s", "t" and short pauses).
HoldMs=200
; Shapes: jaw plus lip shapes (spread, rounded, closed, teeth). Jaw: jaw only.
Mode=Shapes

[Keys]
; Virtual-key codes (https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes), 0 = off.
; Push-to-talk: the mouth only moves while this key is held, for example 0x56 for V.
PushToTalkKey=0
; Mute: press once to stop the mouth, again to start it, for example 0x4D for M.
MuteToggleKey=0

[Face]
; 1: your own character's mouth moves too. 0: only the other players see it.
AnimateSelf=1
; Scales every mouth shape (1 = normal).
MouthStrength=1.0

[Network]
; How long the other players' mouths wait before showing what arrives, in milliseconds. Raise it to line the
; mouth up with a voice chat that lags behind.
RemoteDelayMs=40
; Players further away than this (game units; 4096 is about 58 m) are left alone.
MaxDistance=4096

[Debug]
; 1: write the microphone level and mouth shapes to the log once a second, to help tune the settings above.
LogLevels=0
