; LipSync Together settings. Change them here (they take effect the next time the game starts) or in game with
; Shift+V (they take effect at once).

[Microphone]
; Part of the microphone's name, as listed in Documents\My Games\Skyrim Special Edition\SKSE\LipSyncTogether.log.
; Leave empty to use the Windows default communications microphone.
; Some virtual or software audio devices pass only silence; if so, name your real microphone here instead.
Device=

[Voice]
; 1: only a voice moves the mouth. Speech has a pitch; keyboard clicks, fans and other room noise do not, so they are
; ignored. 0: anything loud enough moves it.
NoiseFilter=1
; How clearly pitched a sound must be to count as a voice, 0 to 1. Lower it if quiet or breathy speech is missed,
; raise it if some noise still gets through.
VoiceThreshold=0.5
; How many dB above the background noise counts as speech. Raise it if the mouth moves on noise, lower it if
; quiet speech is missed.
GateDb=10
; Anything quieter than this (dBFS) never counts as speech.
MinLevelDb=-55
; How far the jaw opens (1 = normal). The jaw follows your own speaking volume, so this rarely needs changing.
Sensitivity=1.0
; How long the mouth keeps moving after the voice stops, in milliseconds (covers "s", "t" and short pauses).
HoldMs=200
; Shapes: jaw plus lip shapes (spread, rounded, closed, teeth). Jaw: jaw only.
Mode=Shapes

[Keys]
; Virtual-key codes (https://learn.microsoft.com/windows/win32/inputdev/virtual-key-codes), 0 = off.
; Push-to-talk: the mouth only moves while this key is held, for example 0x56 for V.
PushToTalkKey=0
; Mute: press once to stop the mouth (and, with voice chat, your voice), again to start it, for example 0x4D for M.
MuteToggleKey=0

[Face]
; 1: your own character's mouth moves too. 0: only the other players see it.
AnimateSelf=1
; Scales every mouth shape (1 = normal).
MouthStrength=1.0

[Network]
; How long the other players' mouths wait before showing what arrives, in milliseconds. Raise it to line the
; mouth up with a voice chat that lags behind.
RemoteDelayMs=40
; Players further away than this (game units; 4096 is about 58 m) are left alone.
MaxDistance=4096

[VoiceChat]
; 1: also carry your voice, and hear the other players louder the closer their characters are (proximity voice
; chat). Every player who wants to hear or be heard needs it on. 0: only mouths are shared (use Discord etc.).
VoiceChat=1
; Where the voice relay runs: the game of the player who hosts the Skyrim Together server runs it, and everyone else
; connects to it on the server's address. Auto: this game runs it when the Skyrim Together server runs on this PC
; (right for nearly everyone). On: always (only if you host but joined your own server through its internet address).
; Off: never. Players from outside your network need VoicePort forwarded (UDP) to the host's PC, like Skyrim
; Together's own port.
HostVoiceRelay=Auto
; 1: require a random key relayed through this Skyrim Together server. Keys are retained until the server restarts,
; so former players can still connect until then. This controls admission, not encryption. 0: anyone can join.
RequireVoiceKey=0
; The relay's UDP port on the server's host (Skyrim Together itself uses 10578).
VoicePort=10579
; Part of the name of the speakers or headphones to play voices on (listed in the log); empty = Windows default.
; Headphones are recommended: from speakers, other voices can reach your microphone and echo back to them.
OutputDevice=
; Volume of the other players' voices (1 = normal).
VoiceVolume=1.0
; Full volume up to this distance (game units; 400 is about 6 m) ...
NearDistance=400
; ... fading out to silence at this one (3000 is about 43 m).
FarDistance=3000
; Voice quality in bits per second: 64000 = full, natural voice (default); 24000 = phone-like, a third of the
; bandwidth; 8000-128000.
VoiceBitrate=64000
; 1: hear your own voice exactly as the others hear it (after the voice filter and compression), to check how you
; sound. Works without a server too. The others hear you either way.
HearOwnVoice=0
; How loud you hear yourself (1 = normal).
OwnVoiceVolume=1.0
; Yelling and whispering, automatic: speak clearly louder than your normal voice and it carries further, speak
; clearly quieter (or whisper) and only players close by hear you. Your normal voice is learned from your first
; ten seconds of talking (the settings window shows the progress), so it works with any microphone. 0: everyone
; always carries the normal distance.
AutoRange=1
; How far a yell carries, as a multiple of NearDistance/FarDistance (2.5 with the defaults: about 107 m).
YellRange=2.5
; How far a whisper carries (0.2 with the defaults: full volume within about 1 m, silent beyond about 9 m).
WhisperRange=0.2
; How many dB louder than your normal voice counts as a full yell (half of it already widens the range a little).
YellDb=10
; How many dB quieter than your normal voice counts as a full whisper.
WhisperDb=8
; 1: breathy whispers (no pitch, which the voice filter otherwise ignores) are sent too, at whisper range.
UnvoicedWhisper=1
; Virtual-key code that mutes and unmutes the other players for you, for example 0x4E for N (0 = off). Your own
; microphone is muted with MuteToggleKey above.
MuteOthersKey=0

[UI]
; The key that opens the in-game settings window, where every setting here can be changed while you play (they take
; effect at once; Save there writes them back to this file). Virtual-key code, 0x56 = V; 0 = no window.
OpenKey=0x56
; 1: only together with Shift (Shift+V). 0: the key alone.
OpenKeyShift=1

[Debug]
; 1: write the microphone level and mouth shapes to the log once a second, to help tune the settings above.
LogLevels=0
